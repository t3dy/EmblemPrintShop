<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emblem Print Shop — Visual Element Gallery</title>
<style>
:root {
  --ink:      #1a1208;
  --paper:    #f5edd8;
  --paper2:   #ede0c4;
  --accent:   #8b3a1c;
  --accent2:  #5c6b2e;
  --muted:    #6b5d48;
  --border:   #c8b89a;
  --card-bg:  #faf3e4;
  --overlay:  rgba(26,18,8,0.85);
  --sans:     'Georgia', 'Times New Roman', serif;
  --mono:     'Courier New', monospace;
  --radius:   4px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); }

/* ── Header ─────────────────────────────────── */
header {
  background: var(--ink);
  color: var(--paper);
  padding: 1.2rem 2rem;
  display: flex;
  align-items: baseline;
  gap: 1.5rem;
  border-bottom: 3px solid var(--accent);
}
header h1 { font-size: 1.4rem; letter-spacing: 0.04em; font-weight: normal; }
header h1 span { color: var(--accent); font-style: italic; }
#count-badge {
  font-family: var(--mono);
  font-size: 0.75rem;
  background: var(--accent);
  color: var(--paper);
  padding: 0.15rem 0.5rem;
  border-radius: 2px;
  letter-spacing: 0.05em;
}

/* ── Layout ──────────────────────────────────── */
.shell { display: flex; min-height: calc(100vh - 60px); }

/* ── Sidebar ─────────────────────────────────── */
aside {
  width: 220px;
  flex-shrink: 0;
  background: var(--paper2);
  border-right: 1px solid var(--border);
  padding: 1rem 0.8rem;
  position: sticky;
  top: 0;
  height: calc(100vh - 60px);
  overflow-y: auto;
}
aside h3 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.5rem;
  margin-top: 1rem;
}
aside h3:first-child { margin-top: 0; }

.filter-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.3rem 0.6rem;
  margin-bottom: 2px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 0.82rem;
  color: var(--ink);
  transition: all 0.12s;
}
.filter-btn:hover { background: var(--paper); border-color: var(--border); }
.filter-btn.active { background: var(--accent); color: var(--paper); border-color: var(--accent); }

#search-box {
  width: 100%;
  padding: 0.35rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  font-family: var(--sans);
  font-size: 0.82rem;
  color: var(--ink);
  margin-bottom: 0.8rem;
}
#search-box:focus { outline: 2px solid var(--accent); }

label.conf-label {
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
#conf-slider { width: 100%; margin-top: 0.3rem; accent-color: var(--accent); }

/* ── Main grid ───────────────────────────────── */
main { flex: 1; padding: 1.2rem 1.4rem; }

.sort-bar {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1rem;
  font-size: 0.8rem;
  color: var(--muted);
}
.sort-bar select {
  padding: 0.25rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  font-family: var(--sans);
  color: var(--ink);
  font-size: 0.8rem;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 1rem;
}

/* ── Card ─────────────────────────────────────── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
}
.card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.15); transform: translateY(-2px); }

.card-thumb {
  width: 100%;
  aspect-ratio: 1;
  background: var(--paper2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
/* Parchment checkerboard to show transparency */
.card-thumb::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(45deg, #d4c8a8 25%, transparent 25%),
    linear-gradient(-45deg, #d4c8a8 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #d4c8a8 75%),
    linear-gradient(-45deg, transparent 75%, #d4c8a8 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  background-color: #e8dbbf;
  opacity: 0.6;
}
.card-thumb img {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.card-thumb .no-img {
  position: relative;
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
  padding: 0.5rem;
}

.card-info { padding: 0.55rem 0.65rem; }
.card-id {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-prompt {
  font-size: 0.78rem;
  font-style: italic;
  color: var(--ink);
  margin-top: 0.15rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.3rem;
}
.score-pill {
  font-family: var(--mono);
  font-size: 0.62rem;
  padding: 0.1rem 0.4rem;
  border-radius: 10px;
  border: 1px solid;
}
.score-high  { color: var(--accent2); border-color: var(--accent2); }
.score-mid   { color: var(--accent);  border-color: var(--accent); }
.score-low   { color: var(--muted);   border-color: var(--border); }
.project-pill {
  font-size: 0.6rem;
  color: var(--muted);
  background: var(--paper2);
  border: 1px solid var(--border);
  padding: 0.1rem 0.35rem;
  border-radius: 10px;
}
.cat-pill {
  font-size: 0.6rem;
  padding: 0.1rem 0.35rem;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.cat-figures   { background: #e8f0fe; color: #1a56a4; }
.cat-animals   { background: #fce8e8; color: #a41a1a; }
.cat-plants    { background: #e8f5e9; color: #1a6e2e; }
.cat-landscape { background: #fff3e0; color: #8c5100; }
.cat-architecture { background: #f3e8ff; color: #5e1a9e; }
.cat-objects   { background: #e8f5f5; color: #1a6e6e; }
.cat-equipment { background: #fff8e1; color: #8c6d00; }

/* ── Detail overlay ──────────────────────────── */
#detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
#detail-overlay.open { display: flex; }

#detail-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 960px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.detail-images {
  border-right: 1px solid var(--border);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.detail-img-block { display: flex; flex-direction: column; gap: 0.3rem; }
.detail-img-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.detail-img-block img {
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 2px;
}
.transparent-bg {
  background-image:
    linear-gradient(45deg, #d4c8a8 25%, transparent 25%),
    linear-gradient(-45deg, #d4c8a8 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #d4c8a8 75%),
    linear-gradient(-45deg, transparent 75%, #d4c8a8 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  background-color: #e8dbbf;
}

.detail-meta {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.detail-meta h2 {
  font-size: 1rem;
  font-weight: normal;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
  font-style: italic;
}
.meta-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.meta-table td { padding: 0.25rem 0.4rem; vertical-align: top; }
.meta-table td:first-child { color: var(--muted); width: 40%; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
.meta-table tr:nth-child(even) td { background: var(--paper2); }

.tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
.tag {
  font-size: 0.68rem;
  padding: 0.15rem 0.45rem;
  border-radius: 10px;
  background: var(--paper2);
  border: 1px solid var(--border);
  color: var(--ink);
}

.detail-actions { display: flex; gap: 0.6rem; margin-top: auto; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.btn {
  padding: 0.4rem 0.8rem;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.78rem;
  cursor: pointer;
  border: 1px solid var(--border);
  text-decoration: none;
  display: inline-block;
  color: var(--ink);
  background: var(--paper2);
  transition: background 0.12s;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn-primary:hover { background: #7a3218; }
.btn-close {
  position: sticky;
  top: 0;
  margin-left: auto;
  background: var(--ink);
  color: var(--paper);
  border: none;
  font-size: 1.1rem;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

/* ── Empty / loading ─────────────────────────── */
#loading { padding: 2rem; color: var(--muted); font-style: italic; text-align: center; }
#empty { padding: 2rem; color: var(--muted); font-style: italic; text-align: center; display: none; }

@media (max-width: 700px) {
  #detail-panel { grid-template-columns: 1fr; }
  .detail-images { border-right: none; border-bottom: 1px solid var(--border); }
  aside { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>Emblem <span>Print Shop</span> — Visual Element Gallery</h1>
  <span id="count-badge">loading…</span>
  <nav style="display:flex;gap:1rem;margin-left:auto;align-items:center">
    <a href="emblems.html" style="color:var(--paper);font-size:0.8rem;opacity:0.75;text-decoration:none">Emblem Catalog</a>
    <a href="motifs.html" style="color:var(--paper);font-size:0.8rem;opacity:0.75;text-decoration:none">Motif Atlas</a>
    <a href="review.html" style="color:var(--paper);font-size:0.8rem;opacity:0.75;text-decoration:none">Review Queue</a>
    <a href="alchemical-images/index.html" style="color:var(--paper);font-size:0.8rem;opacity:0.9;text-decoration:none;border:1px solid var(--accent);padding:0.15rem 0.6rem;border-radius:3px">☿ Alchemical Images</a>
    <button onclick="loadCatalog()" style="background:transparent;border:1px solid var(--muted);color:var(--paper);padding:0.2rem 0.7rem;border-radius:3px;cursor:pointer;font-family:var(--sans);font-size:0.78rem">↻ Refresh</button>
  </nav>
</header>
<div id="filter-banner" style="display:none;background:var(--accent);color:var(--paper);padding:0.35rem 1.5rem;font-size:0.8rem">
  Filtered: <span id="filter-desc"></span>
  <button onclick="clearUrlFilter()" style="margin-left:1rem;background:transparent;border:1px solid rgba(255,255,255,0.4);color:var(--paper);padding:0.1rem 0.5rem;border-radius:3px;cursor:pointer;font-size:0.75rem">Clear filter ✕</button>
</div>

<div class="shell">
<aside>
  <input id="search-box" type="search" placeholder="Search emblem, motif…" autocomplete="off">

  <h3>Project</h3>
  <div id="project-filters"></div>

  <h3>Category</h3>
  <div id="category-filters"></div>

  <h3>Motif</h3>
  <div id="tag-filters"></div>

  <h3>Min Confidence</h3>
  <label class="conf-label">
    <span>0%</span><span id="conf-val">30%</span><span>100%</span>
  </label>
  <input id="conf-slider" type="range" min="0" max="100" value="30">

  <h3>Sort</h3>
  <select id="sort-select" style="width:100%;padding:0.3rem;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--sans);font-size:0.8rem;background:var(--card-bg);color:var(--ink);">
    <option value="source">Source order</option>
    <option value="score_desc">Confidence ↓</option>
    <option value="score_asc">Confidence ↑</option>
    <option value="coverage_desc">Coverage ↓</option>
    <option value="motif">Motif A–Z</option>
  </select>
</aside>

<main>
  <div id="loading">Loading catalog…</div>
  <div id="empty">No elements match the current filters.</div>
  <div id="grid"></div>
</main>
</div>

<!-- Detail overlay -->
<div id="detail-overlay" role="dialog" aria-modal="true">
  <div id="detail-panel">
    <div class="detail-images" id="detail-images"></div>
    <div class="detail-meta" id="detail-meta"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────
let ALL_RECORDS = [];
let FILTERED = [];
let activeProject = null;
let activeTags = new Set();
let activeCategory = null;
let searchQ = '';
let minConf = 0.30;
let sortMode = 'source';
let activeEmblem = null;  // set via ?emblem=af_37

// ── Load catalog ──────────────────────────────
async function loadCatalog() {
  try {
    const r = await fetch('gallery_catalog.json?_=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    ALL_RECORDS = data.records || [];
    buildFilters(data);
    applyUrlParams();
    applyFilters();
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').textContent =
      'Could not load gallery_catalog.json. Run: python scripts/build_catalog.py';
  }
}

// ── URL param filtering ───────────────────────
function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const tag = p.get('tag');
  const search = p.get('search');
  const project = p.get('project');
  const emblem = p.get('emblem');
  const descs = [];

  if (tag) {
    activeTags.add(tag);
    document.querySelectorAll('[data-type="tag"]').forEach(b => {
      if (b.dataset.value === tag) b.classList.add('active');
    });
    descs.push(`motif: "${tag}"`);
  }
  if (search) {
    searchQ = search.toLowerCase();
    document.getElementById('search-box').value = search;
    descs.push(`search: "${search}"`);
  }
  if (project) {
    activeProject = project;
    document.querySelectorAll('[data-type="project"]').forEach(b => {
      b.classList.remove('active');
      if (b.dataset.value === project) b.classList.add('active');
    });
    descs.push(`project: "${project}"`);
  }
  if (emblem) {
    activeEmblem = emblem;
    descs.push(`emblem: "${emblem}"`);
  }

  if (descs.length > 0) {
    document.getElementById('filter-banner').style.display = 'block';
    document.getElementById('filter-desc').textContent = descs.join(' · ');
  }
}

function clearUrlFilter() {
  activeTags.clear();
  searchQ = '';
  activeProject = null;
  activeEmblem = null;
  activeCategory = null;
  document.getElementById('search-box').value = '';
  document.querySelectorAll('[data-type="tag"]').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('[data-type="project"]').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('[data-type="category"]').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-type="project"][data-value=""]')?.classList.add('active');
  document.getElementById('filter-banner').style.display = 'none';
  history.replaceState(null, '', location.pathname);
  applyFilters();
}

// ── Build sidebar filters ─────────────────────
function buildFilters(data) {
  // Tag frequency index
  const tagCount = {};
  (data.records || []).forEach(r => (r.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));

  // Project buttons
  const pf = document.getElementById('project-filters');
  const allBtn = btn('All projects', null, 'project');
  allBtn.classList.add('active');
  pf.appendChild(allBtn);
  (data.projects || []).forEach(p => pf.appendChild(btn(p, p, 'project')));

  // Category buttons
  const CATS = ['figures','animals','plants','landscape','architecture','objects','equipment'];
  const catCount = {};
  (data.records || []).forEach(r => { if (r.category) catCount[r.category] = (catCount[r.category]||0)+1; });
  const cf = document.getElementById('category-filters');
  CATS.filter(c => catCount[c] > 0).forEach(c => {
    const b = btn(c, c, 'category');
    b.classList.add('cat-pill', `cat-${c}`);
    const badge = document.createElement('span');
    badge.textContent = catCount[c] || 0;
    badge.style.cssText = 'margin-left:4px;font-size:0.7em;opacity:0.7;';
    b.appendChild(badge);
    cf.appendChild(b);
  });

  // Tag buttons — sorted by frequency desc, with count badge
  const tf = document.getElementById('tag-filters');
  const sortedTags = (data.tags || []).slice().sort((a, b) => (tagCount[b] || 0) - (tagCount[a] || 0));
  sortedTags.forEach(t => {
    const b = btn(t, t, 'tag');
    const badge = document.createElement('span');
    badge.textContent = tagCount[t] || 0;
    badge.style.cssText = 'margin-left:4px;font-size:0.7em;opacity:0.6;';
    b.appendChild(badge);
    tf.appendChild(b);
  });
}

function btn(label, value, type) {
  const b = document.createElement('button');
  b.className = 'filter-btn';
  b.textContent = label;
  b.dataset.value = value ?? '';
  b.dataset.type = type;
  b.onclick = () => handleFilter(b, type, value);
  return b;
}

function handleFilter(el, type, value) {
  if (type === 'project') {
    document.querySelectorAll('[data-type="project"]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activeProject = value;
  } else if (type === 'category') {
    document.querySelectorAll('[data-type="category"]').forEach(b => b.classList.remove('active'));
    if (activeCategory === value) { activeCategory = null; }
    else { el.classList.add('active'); activeCategory = value; }
  } else if (type === 'tag') {
    if (activeTags.has(value)) { activeTags.delete(value); el.classList.remove('active'); }
    else { activeTags.add(value); el.classList.add('active'); }
  }
  applyFilters();
}

// ── Confidence slider ─────────────────────────
document.getElementById('conf-slider').addEventListener('input', function() {
  minConf = +this.value / 100;
  document.getElementById('conf-val').textContent = this.value + '%';
  applyFilters();
});

// ── Search ────────────────────────────────────
document.getElementById('search-box').addEventListener('input', function() {
  searchQ = this.value.toLowerCase();
  applyFilters();
});

// ── Sort ──────────────────────────────────────
document.getElementById('sort-select').addEventListener('change', function() {
  sortMode = this.value;
  applyFilters();
});

const PAGE_SIZE = 120;
let pageOffset = 0;

// ── Filter + render ───────────────────────────
function applyFilters() {
  FILTERED = ALL_RECORDS.filter(r => {
    if (activeProject && r.project !== activeProject) return false;
    if (activeEmblem && r.emblem_id !== activeEmblem && r.canonical_emblem_id !== activeEmblem) return false;
    if (activeCategory && r.category !== activeCategory) return false;
    if (activeTags.size > 0 && ![...activeTags].every(t => (r.tags||[]).includes(t))) return false;
    if ((r.score || 0) < minConf) return false;
    if (searchQ) {
      const hay = [r.emblem_id, r.prompt, r.project, r.category, ...(r.tags||[])].join(' ').toLowerCase();
      if (!hay.includes(searchQ)) return false;
    }
    return true;
  });

  // Sort
  FILTERED.sort((a, b) => {
    switch(sortMode) {
      case 'score_desc': return (b.score||0) - (a.score||0);
      case 'score_asc':  return (a.score||0) - (b.score||0);
      case 'coverage_desc': return (b.coverage_pct||0) - (a.coverage_pct||0);
      case 'motif': return (a.prompt||'').localeCompare(b.prompt||'');
      default: return (a.emblem_id||'').localeCompare(b.emblem_id||'');
    }
  });

  pageOffset = 0;
  document.getElementById('count-badge').textContent = `${FILTERED.length} / ${ALL_RECORDS.length} elements`;
  document.getElementById('empty').style.display = FILTERED.length === 0 ? 'block' : 'none';
  renderGrid();
}

// ── Render grid (paginated) ───────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const page = FILTERED.slice(0, pageOffset + PAGE_SIZE);
  page.forEach(r => grid.appendChild(makeCard(r)));
  // Remove old load-more sentinel
  const old = document.getElementById('load-more-sentinel');
  if (old) old.remove();
  if (FILTERED.length > pageOffset + PAGE_SIZE) {
    const sentinel = document.createElement('div');
    sentinel.id = 'load-more-sentinel';
    sentinel.style.cssText = 'grid-column:1/-1;text-align:center;padding:1rem;';
    const btn = document.createElement('button');
    btn.textContent = `Load more (${FILTERED.length - pageOffset - PAGE_SIZE} remaining)`;
    btn.style.cssText = 'padding:0.5rem 1.5rem;cursor:pointer;border:1px solid var(--border);background:var(--paper);border-radius:4px;font-size:0.85rem;';
    btn.onclick = () => { pageOffset += PAGE_SIZE; renderGrid(); };
    sentinel.appendChild(btn);
    grid.appendChild(sentinel);
  }
}

function makeCard(r) {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openDetail(r);

  const score = r.score || 0;
  const scoreClass = score >= 0.6 ? 'score-high' : score >= 0.35 ? 'score-mid' : 'score-low';
  const PROJ_ABBR = {
    claudiens: 'AF', hypnerotomachia: 'HP', cramer: 'CR', rosarium: 'RP',
    splendor_solis: 'SS', paul_marshall: 'PM', mclean: 'MC', obrist: 'OB',
    khunrath: 'KH', maier_arcana: 'MA', stolcius: 'ST', mylius: 'MY',
    fludd: 'FL', hall: 'HL', unknown: '??',
  };
  const proj = PROJ_ABBR[r.project_key] || r.project_key?.slice(0,2).toUpperCase() || '?';

  // Use enriched Claudiens label when available; fall back to generic prompt
  const cardTitle = r.object_label || r.prompt || '';
  const cardSub = r.emblem_label
    ? `${r.emblem_label}`
    : r.emblem_id || '';

  card.innerHTML = `
    <div class="card-thumb">
      ${r.transparent_png_web
        ? `<img src="${r.transparent_png_web}" alt="${cardTitle}" loading="lazy">`
        : `<div class="no-img">No image</div>`}
    </div>
    <div class="card-info">
      <div class="card-id" title="${r.emblem_id || ''}">${cardSub}</div>
      <div class="card-prompt">${cardTitle}</div>
      <div class="card-meta">
        <span class="score-pill ${scoreClass}">${(score*100).toFixed(0)}%</span>
        <span class="project-pill">${proj}</span>
        ${r.category ? `<span class="cat-pill cat-${r.category}">${r.category.slice(0,3)}</span>` : ''}
      </div>
    </div>`;
  return card;
}

// ── Detail panel ──────────────────────────────
function openDetail(r) {
  const overlay = document.getElementById('detail-overlay');
  const images = document.getElementById('detail-images');
  const meta = document.getElementById('detail-meta');

  images.innerHTML = `
    <button class="btn-close" onclick="closeDetail()" aria-label="Close">✕</button>
    ${r.crop_jpg_web ? `
    <div class="detail-img-block">
      <div class="detail-img-label">Original crop</div>
      <img src="${r.crop_jpg_web}" alt="crop">
    </div>` : ''}
    ${r.transparent_png_web ? `
    <div class="detail-img-block">
      <div class="detail-img-label">Transparent cutout</div>
      <div class="transparent-bg" style="border:1px solid var(--border);border-radius:2px;padding:0.5rem;">
        <img src="${r.transparent_png_web}" alt="transparent">
      </div>
    </div>` : ''}
    ${r.review_overlay_web ? `
    <div class="detail-img-block">
      <div class="detail-img-label">Segmentation review</div>
      <img src="${r.review_overlay_web}" alt="review overlay">
    </div>` : ''}`;

  const score = r.score || 0;
  const tags = (r.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const bbox = (r.bbox || []).join(', ');
  const px = (r.mask_pixel_count || 0).toLocaleString();
  const cov = r.coverage_pct != null ? r.coverage_pct + '%' : '–';
  const label = r.emblem_label ? `<p style="font-style:italic;margin-bottom:0.4rem">${r.emblem_label}</p>` : '';
  const motto = r.motto ? `<p style="font-size:0.78rem;color:var(--muted);margin-bottom:0.6rem;border-left:2px solid var(--accent);padding-left:0.5rem">${r.motto}</p>` : '';
  const stage = r.theo_stage || r.stage
    ? `<tr><td>Stage</td><td>${r.theo_stage || r.stage}</td></tr>` : '';
  const planetary = r.theo_planetary
    ? `<tr><td>Planetary</td><td>${r.theo_planetary}</td></tr>` : '';
  const color = r.theo_color
    ? `<tr><td>Color assoc.</td><td>${r.theo_color}</td></tr>` : '';
  const theoVE = r.theo_visual_elements && r.theo_visual_elements.length
    ? `<div style="margin-top:0.6rem">
         <div class="detail-img-label" style="margin-bottom:0.3rem">Depicted visual elements (TheoAlchemyDB)</div>
         <div class="tag-list">${r.theo_visual_elements.map(e => `<span class="tag">${e}</span>`).join('')}</div>
       </div>` : '';
  const theoTitle = r.theo_title
    ? `<p style="font-size:0.78rem;color:var(--accent2);margin-bottom:0.4rem">TheoAlchemyDB: ${r.theo_title}</p>` : '';

  meta.innerHTML = `
    <h2>${r.object_label || r.prompt || r.emblem_id}</h2>
    ${theoTitle}${label}${motto}
    <table class="meta-table">
      <tr><td>Emblem ID</td><td>${r.emblem_id || '–'}</td></tr>
      <tr><td>Project</td><td>${r.project || '–'}</td></tr>
      ${r.category ? `<tr><td>Category</td><td><span class="cat-pill cat-${r.category}" style="font-size:0.72rem">${r.category}</span></td></tr>` : ''}
      ${stage}${planetary}${color}
      <tr><td>Detection score</td><td>${(score*100).toFixed(1)}%</td></tr>
      <tr><td>Bounding box</td><td style="font-family:var(--mono);font-size:0.72rem">[${bbox}]</td></tr>
      <tr><td>Mask pixels</td><td>${px}</td></tr>
      <tr><td>Coverage</td><td>${cov} of image</td></tr>
      <tr><td>Extracted</td><td style="font-family:var(--mono);font-size:0.7rem">${(r.extracted_at||'').replace('T',' ').split('.')[0]}</td></tr>
    </table>
    <div>
      <div class="detail-img-label" style="margin-bottom:0.4rem">Detection prompt / motif tags</div>
      <div class="tag-list">${tags}</div>
    </div>
    ${theoVE}
    <div class="detail-actions">
      ${r.transparent_png_web ? `<a class="btn btn-primary" href="${r.transparent_png_web}" download>Download PNG</a>` : ''}
      ${r.crop_jpg_web ? `<a class="btn" href="${r.crop_jpg_web}" download>Download crop</a>` : ''}
      ${r.source_image_web ? `<a class="btn" href="${r.source_image_web}" target="_blank">Source image</a>` : ''}
      ${(r.canonical_emblem_id || r.emblem_id) ? `<a class="btn" href="emblems.html?emblem=${encodeURIComponent(r.canonical_emblem_id || r.emblem_id)}" target="_blank">View in catalog →</a>` : ''}
    </div>`;

  overlay.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

// Close on backdrop click
document.getElementById('detail-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// ── Boot ──────────────────────────────────────
loadCatalog();
</script>
</body>
</html>
